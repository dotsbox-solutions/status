# Upptime (https://upptime.js.org) for status.dotsbox.com, run by our own workflow instead of
# Upptime's generated ones (PLATFORM-318):
# - Its data goes to the branch master, never main. main (this file, upptime.base.json) changes
#   only through pull requests, as every repo's default branch in the org must (the ruleset
#   app_repos, platform's tofu/github/rulesets.tf). Upptime's status page reads its data from the
#   branch named master, so that's where the data lives.
# - The sites come from the org variable STATUS_SITES, which platform's OpenTofu writes from the
#   site records (platform: tools/status-sites.py, tofu/github/status-sites.tf): a site that goes
#   live is checked within 5 minutes and on the page within the hour, and nobody keeps a list here.
# - The token is this workflow's own GITHUB_TOKEN, no personal one: it writes master and the
#   outage issues, and never touches a workflow (Upptime's template updater isn't used; Renovate
#   updates the versions below by pull request).
# - The outage issues assign nobody (assignees: []): Grafana Cloud does the alerting, not this.
name: Upptime
on:
  schedule:
    - cron: "*/5 * * * *"   # update: check each site, open or close its outage issue
    - cron: "7 23 * * *"    # response-time
    - cron: "37 0 * * *"    # graphs
    - cron: "52 0 * * *"    # readme (master's README summary, history/summary.json)
    - cron: "17 * * * *"    # site: the status page, hourly, so a new site shows within the hour
  push:
    branches: [main]        # a change to the page's settings: build the site again
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [update, response-time, graphs, readme, site]
        default: update
permissions: {}
# One at a time: every command but site pushes to master.
concurrency:
  group: upptime
  cancel-in-progress: false
jobs:
  run:
    name: upptime
    runs-on: ubuntu-latest   # a public repo: GitHub's runners (the org's own are for private repos only)
    permissions:
      contents: write        # master
      issues: write          # the outage issues
    env:
      COMMAND: ${{ inputs.command || (github.event_name == 'push' && 'site') || (github.event.schedule == '7 23 * * *' && 'response-time') || (github.event.schedule == '37 0 * * *' && 'graphs') || (github.event.schedule == '52 0 * * *' && 'readme') || (github.event.schedule == '17 * * * *' && 'site') || 'update' }}
    outputs:
      command: ${{ env.COMMAND }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Upptime's settings (upptime.base.json from main, the sites from STATUS_SITES)
        env:
          STATUS_SITES: ${{ vars.STATUS_SITES }}
        run: |
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:upptime.base.json > "$RUNNER_TEMP/base.json"
          python3 - "$RUNNER_TEMP/base.json" <<'PY'
          import json, os, sys
          base = json.load(open(sys.argv[1]))
          try:
              sites = json.loads(os.environ.get("STATUS_SITES") or "")
          except ValueError:
              sys.exit("STATUS_SITES (the org variable platform's OpenTofu writes) is missing or not JSON")
          if not isinstance(sites, list) or not sites or not all(isinstance(s, dict) and s.get("name") and str(s.get("url", "")).startswith("https://") for s in sites):
              sys.exit("STATUS_SITES isn't a non-empty list of {name, url: https://...}")
          base["sites"] = [{"name": s["name"], "url": s["url"]} for s in sites]
          # JSON is YAML: Upptime reads .upptimerc.yml with js-yaml.
          json.dump(base, open(".upptimerc.yml", "w"), indent=2)
          print("sites:", ", ".join(s["name"] for s in base["sites"]))
          PY
      - uses: actions/setup-node@v7
        if: env.COMMAND == 'graphs'
        with:
          node-version: "20"
      - uses: upptime/uptime-monitor@v1.46.5
        with:
          command: ${{ env.COMMAND }}
        env:
          GH_PAT: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        if: env.COMMAND == 'site'
        with:
          path: site/status-page/__sapper__/export/
  deploy:
    needs: run
    if: needs.run.outputs.command == 'site'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
